# ===================================================================
# Smart Community Health Monitoring & Early Warning System (Northeast India)
# Spring Boot Configuration
# ===================================================================

server.port=${PORT:${BACKEND_PORT:8080}}
server.servlet.context-path=/

# -------------------------------------------------------------------
# Database Configuration
# Supports Embedded H2 (default), MySQL, and PostgreSQL
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:h2:mem:smart_health_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}}
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# JPA & Hibernate (auto-detects dialect for H2, MySQL, PostgreSQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (Enabled for inspection at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------
# Security & JWT Configuration
# -------------------------------------------------------------------
smarthealth.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
smarthealth.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -------------------------------------------------------------------
# External ML Microservice Configuration
# -------------------------------------------------------------------
smarthealth.ml.service-url=${ML_SERVICE_URL:http://localhost:5000}
smarthealth.ml.connect-timeout-ms=5000
smarthealth.ml.read-timeout-ms=8000

# -------------------------------------------------------------------
# Swagger OpenAPI Documentation
# -------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.smarthealth=INFO
logging.level.org.springframework.security=WARN
